name: Verify mirrors

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          urls=(
            "https://gofile.io/d/l2wPBIMQ"
            "https://filebin.net/sterzhen-18/sterzhen-release.apk"
            "https://filebin.net/sterzhen-18/sterzhen-release.apk?download=1"
          )
          out="Проверка зеркал:"
          for u in "${urls[@]}"; do
            res=$(curl -sIL -m 60 "$u" 2>&1 | grep -iE "^(HTTP/|content-length|content-type)" | tr '\n' ' ' || true)
            out="$out"$'\n'"--- $u"$'\n'"$res"
          done
          echo "$out" > /tmp/check.md
          head -c 60000 /tmp/check.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat /tmp/check.md)" || true
